# Bản đầu dựng corpus; CHƯA tune trên bộ đánh giá RAG.
# Units = từ/âm tiết ngăn bằng whitespace, không phải model token.
chunking:
  max_units: 320
  overlap_units: 48
# Phiên bản dùng chung trong rag_index_status; dense resume cùng corpus/model.
index_version: rag_v1
bm25:
  root: data/rag/bm25
  # Sync dựng snapshot mới mỗi lần; giữ CURRENT + bản liền trước, xoá bản cũ hơn.
  keep_snapshots: 2
dense:
  url: http://127.0.0.1:6333
  collection: rag_v1_qwen_text_v1
  batch_size: 32
  concurrency: 4
ner:
  model_dir: data/models/bamibert-qft-s44/best
  ner_version: bamibert-qft-s44-clean-20261122
  max_length: 2048
  window_overlap: 512
  batch_size: 8
  device: auto
sync:
  # Chờ các lượt /ask đang giữ khoá đọc (gồm cả cold start Qwen) trước khi ghi index.
  lock_wait_seconds: 600
query_ner:
  enabled: true
  in_chunk_boost: 0.008
  in_article_boost: 0.003
  label_match_multiplier: 1.0
  text_only_multiplier: 0.4
retrieval:
  branch_limit: 30
  rrf_k: 60
# Chatbot tool calling (agent.py) — mặc định của khung chat từ 22/11/2026 (Modal đã deploy với
# models.llm.tool_calling=true). Đặt false để quay về pipeline snapshot single-turn.
tool_calling:
  enabled: true
  max_rounds: 3
  max_calls_per_round: 4
  round_max_tokens: 512
  history_turns: 3
  history_answer_chars: 500
  max_context_chunks: 10
# Danh sách chuyên mục cho hồ sơ người dùng; nên khớp events.category_std / category_map.category_std.
profile:
  categories: [Chính trị, Pháp luật, Thể thao, Giáo dục, Thế giới, Kinh tế, Du lịch, Khoa học – Công nghệ, Sức khỏe, Văn hóa]
generation:
  candidate_limit: 60
  max_context_chunks: 8
  max_per_article: 2
  max_per_source: 3
models:
  app_name: eventrank-rag-models
  cache_volume: eventrank-rag-model-cache
  # Cả hai service tắt sau chừng này giây rảnh; đổi xong phải deploy lại Modal.
  scaledown_window: 120
  # Ping Qwen trong lúc gọi Gemma để hai service tắt cùng mốc sau token cuối.
  keepalive:
    interval_seconds: 30
    max_seconds: 900
  embedding:
    model: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    dimension: 1024
    max_length: 2048
    batch_size: 8
    gpu: L4
    max_containers: 4
    buffer_containers: 0
    instruction: Given a Vietnamese news question, retrieve relevant news passages that answer the question.
  llm:
    model: google/gemma-4-12B-it-qat-w4a16-ct
    revision: 1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee
    gpu: [L4, A10]
    max_model_len: 8192
    max_output_tokens: 1024
    gpu_memory_utilization: 0.85
    # vLLM 0.33.0: --enable-auto-tool-choice --tool-call-parser gemma4 (template của model đã hỗ trợ tool).
    tool_calling: true
