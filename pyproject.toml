[project]
name = "eventrank"
version = "0.1.0"
description = "Nhận diện sự kiện đa nguồn & xếp hạng xu hướng tin tức tiếng Việt"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Nhãn yếu / ML chạy trên CPU (không cần GPU)
ml = ["numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5", "pyyaml>=6.0"]
# Embedding zero-shot làm tín hiệu ngữ nghĩa cho nhãn yếu: `uv sync --group embed` (PyTorch bản CPU, ~1 GB)
embed = ["sentence-transformers>=3.0", "torch>=2.4", "onnxruntime>=1.18"]

[tool.uv]
default-groups = ["dev", "ml"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventrank"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
